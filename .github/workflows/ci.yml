name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  EXPO_NO_TELEMETRY: 1

jobs:
  verify:
    name: Lint, typecheck, build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (składnia, nieużywane importy)
        run: npm run lint

      - name: Typecheck (TypeScript)
        run: npm run typecheck

      - name: Build (bundle JS dla iOS, Androida i web)
        run: npx expo export --platform all

  health:
    name: Expo Doctor and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Expo Doctor
        run: npx expo-doctor

      - name: npm audit
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy install
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241

      - name: Trivy scan (filesystem)
        run: |
          trivy fs . \
            --scanners vuln,secret,misconfig \
            --severity CRITICAL,HIGH,MEDIUM,LOW \
            --ignore-unfixed \
            --exit-code 0 \

      - name: Generate SBOM
        run: trivy fs . --format cyclonedx --output sbom.cdx.json

      - name: Scan SBOM
        run: trivy sbom sbom.cdx.json --severity HIGH,CRITICAL --exit-code 1

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
